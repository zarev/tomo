services:
  db:
    image: ankane/pgvector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: tomo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tomo
      PYTHONUNBUFFERED: '1'
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_CLI_ENABLED: "1"
      GEMINI_PIPELINE_ENABLED: "1"
      GEMINI_PIPELINE_REQUIRED: "1"
      GEMINI_MAX_PEOPLE: "100"
      GEMINI_CLI_TIMEOUT: "120"
      GEMINI_CLI_COMMAND: ${GEMINI_CLI_COMMAND:-gemini --output-format json --prompt}
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  db-data:
