<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tomo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e5d6a5;
        font-family: "Press Start 2P", "Courier New", monospace;
        color: #3b2b20;
        letter-spacing: 0.04em;
      }

      .pet-shell {
        width: clamp(320px, 90vw, 520px);
        background: #f3d680;
        border: 4px solid #8b6f3d;
        border-radius: 26px;
        padding: 28px 28px 24px;
        box-shadow: 0 12px 0 #aa8442, 0 16px 30px rgba(85, 57, 21, 0.4);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .screen {
        position: relative;
        background: #f6d9b4;
        border: 4px solid #5d3d2b;
        border-radius: 18px;
        overflow: hidden;
        min-height: 240px;
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% -20% -20% -40%;
        background-image: repeating-linear-gradient(
            135deg,
            rgba(164, 211, 208, 0.9) 0 38px,
            rgba(247, 166, 183, 0.9) 38px 76px
          );
        transform: rotate(-6deg) scale(1.15);
      }

      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 237, 205, 0.58);
      }

      .screen-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 18px 20px;
        gap: 18px;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        text-transform: uppercase;
        font-size: 0.7rem;
      }

      .status-clock {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(248, 240, 212, 0.7);
        padding: 6px 10px;
        border-radius: 999px;
        border: 2px solid #5d3d2b;
      }

      .status-clock span:first-child {
        font-size: 0.85rem;
      }

      .pet-name {
        text-align: center;
        flex: 1;
        display: grid;
        justify-items: center;
        gap: 2px;
      }

      .pet-name .label {
        font-size: 0.6rem;
        letter-spacing: 0.16em;
      }

      .pet-name .value {
        font-size: 0.9rem;
      }

      .meters {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .meter {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .meter-label {
        font-size: 0.6rem;
      }

      .meter-dots {
        display: flex;
        gap: 4px;
      }

      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #5d3d2b;
        background: rgba(247, 238, 214, 0.8);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.65);
      }

      .dot.filled.food {
        background: linear-gradient(145deg, #b93b20 0%, #f8734a 80%);
        box-shadow: inset -2px -3px 0 rgba(77, 22, 7, 0.45);
      }

      .dot.filled.fun {
        background: linear-gradient(145deg, #f5f0f4 0%, #ffffff 70%);
        box-shadow: inset -2px -3px 0 rgba(120, 112, 121, 0.35);
      }

      .pet-display {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pet-sprite {
        font-size: 3.4rem;
        color: #1a1918;
        text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
      }

      .pet-speech {
        background: rgba(246, 231, 192, 0.9);
        border: 3px solid #5d3d2b;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.65rem;
        min-height: 54px;
        display: flex;
        align-items: center;
      }

      .action-panel {
        background: #d8e2a2;
        border: 4px solid #657844;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .action-label {
        font-size: 0.75rem;
      }

      textarea {
        width: 100%;
        min-height: 70px;
        resize: vertical;
        border: 3px solid #657844;
        border-radius: 12px;
        padding: 12px;
        background: #eef4c8;
        font-family: inherit;
        font-size: 0.7rem;
        color: #2e311d;
      }

      textarea::placeholder {
        color: rgba(46, 49, 29, 0.6);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 3px solid #5d3d2b;
        background: linear-gradient(180deg, #f5df94 0%, #ddb968 100%);
        border-radius: 14px;
        padding: 10px 18px;
        font-family: inherit;
        font-size: 0.65rem;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 4px 0 #8b6f3d;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #8b6f3d;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .memories-card {
        background: rgba(255, 255, 255, 0.6);
        border: 4px solid #5d3d2b;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 160px;
        overflow: hidden;
      }

      .memories-card h3 {
        margin: 0;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .memories {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.6rem;
      }

      .memory-row {
        background: rgba(247, 234, 201, 0.8);
        border: 2px solid #8b6f3d;
        border-radius: 10px;
        padding: 8px 10px;
      }

      @media (max-width: 540px) {
        .status-row {
          flex-direction: column;
          align-items: stretch;
        }

        .meters {
          flex-direction: row;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="pet-shell">
      <div class="screen">
        <div class="screen-content">
          <div class="status-row">
            <div class="status-clock">
              <span>🕒</span>
              <span>2 Days</span>
            </div>
            <div class="pet-name">
              <div class="label">Name</div>
              <div class="value" id="pet-name">Pookie</div>
            </div>
            <div class="meters">
              <div class="meter">
                <div class="meter-label">Food</div>
                <div class="meter-dots" aria-hidden="true">
                  <span class="dot filled food"></span>
                  <span class="dot filled food"></span>
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
              </div>
              <div class="meter">
                <div class="meter-label">Fun</div>
                <div class="meter-dots" aria-hidden="true">
                  <span class="dot filled fun"></span>
                  <span class="dot filled fun"></span>
                  <span class="dot"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="pet-display">
            <div class="pet-sprite" id="pet-sprite">9</div>
          </div>

          <div class="pet-speech" id="reply">Talk to Tomo to see a reply.</div>
        </div>
      </div>

      <div class="action-panel">
        <div class="action-label">Type an action...</div>
        <textarea id="input" placeholder="Type an action..."></textarea>
        <div class="actions">
          <button id="send">Talk</button>
          <button id="search">Search Memories</button>
        </div>
      </div>

      <div class="memories-card">
        <h3>Memories</h3>
        <div class="memories" id="memories"></div>
      </div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
